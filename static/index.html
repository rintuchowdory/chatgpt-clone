<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ChatGPT Clone</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #212121; color: #ececec; display: flex; flex-direction: column; height: 100vh; }
  #header { padding: 16px 24px; border-bottom: 1px solid #333; font-size: 18px; font-weight: 600; color: #fff; }
  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 75%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .user { background: #2f2f2f; align-self: flex-end; border-bottom-right-radius: 4px; }
  .bot  { background: #1a1a2e; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #333; }
  .bot .label { font-size: 11px; color: #888; margin-bottom: 4px; }
  #input-area { padding: 16px 24px; border-top: 1px solid #333; display: flex; gap: 10px; }
  #input { flex: 1; background: #2f2f2f; border: 1px solid #444; border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 15px; resize: none; height: 50px; outline: none; }
  #input:focus { border-color: #666; }
  #send { background: #10a37f; color: white; border: none; border-radius: 8px; padding: 0 20px; font-size: 15px; cursor: pointer; height: 50px; }
  #send:disabled { background: #444; cursor: not-allowed; }
  .typing { color: #888; font-style: italic; }
</style>
</head>
<body>
<div id="header">🤖 ChatGPT Clone — Powered by Groq</div>
<div id="messages"></div>
<div id="input-area">
  <textarea id="input" placeholder="Send a message..." rows="1"></textarea>
  <button id="send">Send</button>
</div>
<script>
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  let history = [];

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "user" : "bot");
    if (role === "assistant") {
      const label = document.createElement("div");
      label.className = "label";
      label.textContent = "Assistant";
      div.appendChild(label);
    }
    const content = document.createElement("div");
    content.textContent = text;
    div.appendChild(content);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return content;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";
    sendBtn.disabled = true;

    addMessage("user", text);
    history.push({ role: "user", content: text });

    const contentEl = addMessage("assistant", "");
    contentEl.className = "typing";
    contentEl.textContent = "Thinking...";

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let reply = "";
      contentEl.className = "";
      contentEl.textContent = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        reply += decoder.decode(value, { stream: true });
        contentEl.textContent = reply;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
      history.push({ role: "assistant", content: reply });
    } catch (e) {
      contentEl.textContent = "Error: " + e.message;
    }
    sendBtn.disabled = false;
    inputEl.focus();
  }

  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
</script>
</body>
</html>
